name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(go tool gofumpt -l .)"
      - name: Check modules
        run: go mod tidy -diff
      - name: Check whitespace
        run: git diff --check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Shuffle test
        run: go test -shuffle=on ./...
      - name: Lint
        run: go tool golangci-lint run --no-config --enable=unused --enable=unparam --enable=ineffassign --enable=goconst ./...
      - name: Vulnerability scan
        run: go tool govulncheck ./...
      - name: Validate deployment configuration
        run: ./scripts/validate-deployment.sh
      - name: Build container
        run: docker build --tag ngbot:ci --build-arg VERSION=ci --build-arg REVISION="$GITHUB_SHA" --build-arg BUILD_DATE=1970-01-01T00:00:00Z .
      - name: Verify container identity and persistent migrations
        run: |
          set -eu
          test "$(docker image inspect ngbot:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker run --rm --entrypoint ./ngbot ngbot:ci --version)" = "ngbot version=ci revision=$GITHUB_SHA build_date=1970-01-01T00:00:00Z"
          docker volume create ngbot-ci-data >/dev/null
          trap 'docker volume rm ngbot-ci-data >/dev/null' EXIT
          docker run --rm --mount source=ngbot-ci-data,target=/data alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1 chown 65532:65532 /data
          for pass in 1 2; do
            docker run --rm --mount source=ngbot-ci-data,target=/data \
              --env NG_TOKEN=validation-token \
              --env NG_DOT_PATH=/data \
              --env NG_LLM_OPENAI_API_KEY=validation-key \
              ngbot:ci --database-maintenance
          done
      - name: Validate Caddy configuration
        run: docker run --rm --env NGBOT_GATEKEEPER_WEBAPP_DOMAIN=antifraud.example.com --env NGBOT_WEBAPP_HOST_PORT=18080 --volume "$PWD/deploy/caddy/ngbot-webapp.Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2 caddy validate --config /etc/caddy/Caddyfile
